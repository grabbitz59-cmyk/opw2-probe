name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/probe.p12"
          ls -l "$RUNNER_TEMP/probe.p12"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/probe.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: probe
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/opw2-probe.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: opw2-probe
          path: out/opw2-probe.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          files: out/opw2-probe.apk
